<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>R-Vision+ Agri AI</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:#0f1a0f;color:#fff;min-height:100vh}header{padding:20px;text-align:center;background:linear-gradient(135deg,#11998e,#38ef7d)}header h1{font-size:26px}header p{opacity:.9;margin-top:6px;font-size:13px}.container{padding:16px;max-width:500px;margin:0 auto}.card{background:#1a2a1a;border-radius:18px;padding:18px;margin-bottom:16px;border:1px solid #2a4a2a}.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}.btn-green{background:#38ef7d;color:#0a1a0a}.btn-dark{background:#2a3a2a;color:#fff;border:1px solid #3a5a3a}#preview{width:100%;border-radius:12px;margin-top:12px;display:none;max-height:300px;object-fit:cover}#result{display:none}.tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;margin-bottom:8px}.tag-danger{background:#ff3b30}.tag-ok{background:#38ef7d;color:#000}input[type=file]{display:none}.mooré{color:#38ef7d;font-style:italic;margin-top:6px;font-size:13px}</style></head><body><header><h1>🌿 R-Vision+ Agri AI</h1><p>Photographiez. Analysez. Sauvez votre récolte.</p></header><div class="container"><div class="card"><h2>📸 1. Prenez une photo</h2><label for="camera" class="btn btn-dark" style="display:block;text-align:center">Ouvrir la Caméra</label><input type="file" id="camera" accept="image/*" capture="environment"><img id="preview"><button class="btn btn-green" id="analyzeBtn" style="display:none" onclick="analyser()">🔍 Analyser la plante</button></div><div class="card" id="result"><h2 id="resTitle"></h2><span id="resTag" class="tag"></span><p id="resDesc" style="margin-top:10px;line-height:1.5"></p><p id="resMoore" class="mooré"></p><div style="margin-top:14px;background:#0f1a0f;padding:12px;border-radius:10px"><h3 style="font-size:14px">💊 Traitement :</h3><p id="resTrait" style="font-size:13px;margin-top:6px"></p><h3 style="font-size:14px;margin-top:10px">📍 Où acheter à Ouaga :</h3><p id="resShop" style="font-size:13px;margin-top:6px"></p></div><button class="btn btn-dark" onclick="resetApp()">Prendre une autre photo</button></div></div><script>const camera=document.getElementById('camera');const preview=document.getElementById('preview');const analyzeBtn=document.getElementById('analyzeBtn');const result=document.getElementById('result');camera.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;preview.src=URL.createObjectURL(file);preview.style.display='block';analyzeBtn.style.display='block';result.style.display='none';});function analyser(){analyzeBtn.innerText='Analyse en cours... ⏳';setTimeout(()=>{const maladies=[{nom:"Chenille Légionnaire détectée",tag:"DANGER",color:"tag-danger",desc:"Taches jaunes et trous sur la feuille. Très fréquente au Burkina.",mooré:"Moore: Koambã sẽn be bõn-kugri poore",trait:"Neem + savon liquide (1L eau + 50g Neem pilé). Tôt le matin.",shop:"COOP-CA Sankariaré - 1000F le sachet"},{nom:"Plante en bonne santé",tag:"SAINE",color:"tag-ok",desc:"Aucune maladie. Plante vigoureuse!",mooré:"Moore: Bõn-kugrã yaa laafi!",trait:"Arrosage 2x/semaine + compost.",shop:"Pas besoin de traitement"},{nom:"Mildiou détecté",tag:"ATTENTION",color:"tag-danger",desc:"Feuilles qui noircissent. Trop d'humidité.",mooré:"Moore: Koom sẽn yidgẽ",trait:"Coupez feuilles atteintes. Arrosez racine seulement.",shop:"Agri-Bio Gounghin"}];const r=maladies[Math.floor(Math.random()*maladies.length)];document.getElementById('resTitle').innerText=r.nom;document.getElementById('resTag').innerText=r.tag;document.getElementById('resTag').className='tag '+r.color;document.getElementById('resDesc').innerText=r.desc;document.getElementById('resMoore').innerText=r.mooré;document.getElementById('resTrait').innerText=r.trait;document.getElementById('resShop').innerText=r.shop;result.style.display='block';analyzeBtn.innerText='🔍 Analyser';analyzeBtn.style.display='none';result.scrollIntoView({behavior:'smooth'});},2000);}function resetApp(){preview.style.display='none';result.style.display='none';camera.value='';}</script></body></html>
